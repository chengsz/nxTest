name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Game Title ID (e.g. 0100000000010000)'
        required: true
        default: '0100000000010000'

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /Library/Developer/CommandLineTools
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf /Users/runner/hostedtoolcache
          df -h

      - name: Clone nxnative
        run: git clone https://github.com/seedds/nxnative.git

      - name: Restore Cache (Shaders)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Games/TargetGame/${{ github.event.inputs.game_id }}*_build
            ~/.nuget/packages
          key: nxnative-build-${{ github.event.inputs.game_id }}-${{ hashFiles('nxnative/dm/games/${{ github.event.inputs.game_id }}*') }}
          restore-keys: |
            nxnative-build-${{ github.event.inputs.game_id }}-

      - name: Install Homebrew & Python Dependencies
        run: |
          brew install xcodegen zstd spirv-cross aria2
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 capstone fonttools

      - name: Download NSP and Keys from Oracle Cloud
        env:
          NSP_URL: ${{ secrets.NSP_ARCHIVE_URL }}
          KEYS_URL: ${{ secrets.KEYS_URL }}
        run: |
          mkdir -p ~/Games/TargetGame ~/keys
          aria2c -x 16 -s 16 "$NSP_URL" -d ~/ -o nsp.zip
          unzip -j ~/nsp.zip -d ~/Games/TargetGame
          rm ~/nsp.zip
          curl -fL "$KEYS_URL" -o ~/keys/prod.keys

      - name: Select Latest Xcode 16
        run: |
          sudo xcode-select -s $(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)/Contents/Developer
          clang --version

      - name: Build IPA from NSP
        working-directory: ./nxnative
        run: |
          dotnet publish dm/gfx/tools/dmsh_xlate/dmsh_xlate.csproj -c Release -r osx-arm64 --self-contained -o dm/gfx/tools/dmsh_xlate_bin

          DM_GAME=${{ github.event.inputs.game_id }} python3 dm/gfx/tools/dmsh_chain.py --update-lock
          for g in dm/games/0100*; do
            if [ -d "$g" ]; then
              DM_GAME=$(basename "$g") python3 dm/gfx/tools/dmsh_chain.py --update-lock
              DM_GAME=$(basename "$g") python3 dm/gfx/tools/dmsh_chain.py --header || true
            fi
          done

          python3 scripts/build_ipa_from_nsp.py ~/Games/TargetGame -k ~/keys/prod.keys

      - name: Force Save Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Games/TargetGame/${{ github.event.inputs.game_id }}*_build
            ~/.nuget/packages
          key: nxnative-build-${{ github.event.inputs.game_id }}-${{ github.run_id }}

      - name: Upload Finished IPA Back to Oracle Cloud
        if: success()
        env:
          UPLOAD_URL: ${{ secrets.OCI_UPLOAD_URL }}
        run: |
          for ipa in ~/Games/TargetGame/*.ipa; do
            filename=$(basename "$ipa")
            echo "Uploading $filename to Oracle Cloud..."
            curl -f -X PUT --upload-file "$ipa" "${UPLOAD_URL%/}/${filename}"
          done
