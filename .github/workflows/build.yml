name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Title ID (e.g. 0100000000010000; leave blank to auto-detect)'
        required: false
        default: '0100000000010000'
      extra_args:
        description: 'Extra build_ipa_from_nsp.py options (e.g. --no-heap-check, --survey-only)'
        required: false
        default: ''

# Only one run at a time: NSP_ARCHIVE_URL points at one game
concurrency:
  group: nxnative-build
  cancel-in-progress: false

jobs:
  build-ipa:
    runs-on: xcode-27          # nxnative pins its Metal compiler to Xcode 27.1 (dmsh_chain.lock)
    timeout-minutes: 360       # GitHub-hosted maximum

    steps:
      - name: Select Xcode 27.1
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_27.1*.app' | sort -V | tail -n 1)
          [ -n "$XCODE" ] || XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -n 1)
          XCODE=$(cd "$XCODE" && pwd -P)   # resolve symlinks to the real app
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "KEEP_XCODE=$XCODE" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Free disk space
        run: |
          df -h /
          for x in /Applications/Xcode*.app; do
            [ -L "$x" ] && continue
            [ "$x" = "$KEEP_XCODE" ] && continue
            echo "Removing $x"
            sudo rm -rf "$x"
          done
          # Keep simulator runtimes: Xcode needs the iOS platform even for a device build
          sudo rm -rf /Library/Developer/CommandLineTools
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf /Users/runner/hostedtoolcache
          df -h /

      - name: Make sure the iOS platform is installed
        run: |
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK_VER"
          if xcrun simctl list runtimes | grep -q "iOS $SDK_VER"; then
            echo "iOS $SDK_VER platform is installed"
          else
            echo "iOS $SDK_VER platform missing - downloading it (this can take a while)"
            xcodebuild -downloadPlatform iOS
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # the script needs 3.12 or newer

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # the prebuilt shader translator runs on .NET 10

      - name: Checkout nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          path: nxnative
          submodules: recursive
          lfs: true

      - name: Record nxnative commit
        run: echo "NX_SHA=$(git -C nxnative rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          brew install xcodegen zstd aria2 sevenzip glslang
          brew cleanup --prune=all || true
          python3 -m pip install lz4 capstone fonttools
          python3 --version
          dotnet --list-runtimes

      - name: Download and extract game
        env:
          NSP_URL: ${{ secrets.NSP_ARCHIVE_URL }}
          INPUT_GAME_ID: ${{ inputs.game_id }}
        run: |
          set -euo pipefail
          GAME_DIR=~/Games/TargetGame
          mkdir -p "$GAME_DIR" ~/dl

          aria2c -x 16 -s 16 --console-log-level=warn --summary-interval=0 \
            "$NSP_URL" -d ~/dl -o download.bin
          FILE=~/dl/download.bin

          # Work out what was downloaded from the file's first bytes, not its name
          MAGIC=$(head -c 4 "$FILE" | xxd -p)
          case "$MAGIC" in
            50465330) NAME=game.nsp ;;   # "PFS0" = raw NSP
            504b0304) NAME=game.zip ;;
            377abcaf) NAME=game.7z  ;;
            52617221) NAME=game.rar ;;
            *) echo "::error::Unrecognized download (first bytes: $MAGIC). Check NSP_ARCHIVE_URL."; exit 1 ;;
          esac
          echo "Downloaded: $NAME"

          case "$NAME" in
            game.nsp) mv "$FILE" "$GAME_DIR/game.nsp" ;;
            *)        7zz e "$FILE" -o"$GAME_DIR" -y > /dev/null; rm -f "$FILE" ;;
          esac
          ls -lh "$GAME_DIR"

          # Pin the game files' timestamps so nxnative's reuse checks see the same files each run
          find "$GAME_DIR" -maxdepth 1 -type f -exec touch -h -t 202001010000 {} +

          # Title ID: use the input if given, otherwise detect it from file names
          GAME_ID=$(echo "$INPUT_GAME_ID" | tr -d ' ')
          if [ -z "$GAME_ID" ]; then
            IDS=$(ls "$GAME_DIR" | grep -oiE '01[0-9a-f]{14}' | tr '[:lower:]' '[:upper:]' | sort -u || true)
            GAME_ID=$(echo "$IDS" | grep '000$' | head -n 1 || true)
            if [ -z "$GAME_ID" ] && [ -n "$IDS" ]; then
              GAME_ID="$(echo "$IDS" | head -n 1 | cut -c1-13)000"
            fi
          fi
          if ! echo "$GAME_ID" | grep -qiE '^01[0-9a-f]{14}$'; then
            echo "::error::Could not determine a valid Title ID. Enter it in the game_id field."
            exit 1
          fi
          echo "Title ID: $GAME_ID"
          echo "GAME_ID=$GAME_ID" >> "$GITHUB_ENV"

          if ls -d nxnative/dm/games/"$GAME_ID"* > /dev/null 2>&1; then
            echo "::notice::nxnative has a profile for $GAME_ID"
          else
            echo "::warning::No nxnative profile for $GAME_ID: the script will survey it and build a best-effort IPA that may not boot."
          fi

      - name: Download keys
        env:
          KEYS_URL: ${{ secrets.KEYS_URL }}
        run: |
          mkdir -p ~/keys
          curl -fsSL "$KEYS_URL" -o ~/keys/prod.keys

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Games/TargetGame/*_build
          key: nxnative-v2-${{ env.GAME_ID }}-${{ env.NX_SHA }}-${{ github.run_id }}
          restore-keys: |
            nxnative-v2-${{ env.GAME_ID }}-${{ env.NX_SHA }}-
            nxnative-v2-${{ env.GAME_ID }}-

      - name: Build IPA
        working-directory: ./nxnative
        timeout-minutes: 300   # stop before the job limit so the cache still gets saved
        env:
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          set -euo pipefail
          df -h /
          # Uses the repo's prebuilt shader translator as-is: rebuilding it changes the
          # shader fingerprints and forces every shader to compile again.
          # shellcheck disable=SC2086
          python3 scripts/build_ipa_from_nsp.py ~/Games/TargetGame -k ~/keys/prod.keys $EXTRA_ARGS

      - name: Save build cache
        if: always() && env.GAME_ID != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/Games/TargetGame/*_build
          key: nxnative-v2-${{ env.GAME_ID }}-${{ env.NX_SHA }}-${{ github.run_id }}

      - name: Upload IPA to Oracle Cloud
        if: success()
        env:
          UPLOAD_URL: ${{ secrets.OCI_UPLOAD_URL }}
        run: |
          shopt -s nullglob
          ipas=(~/Games/TargetGame/*.ipa)
          if [ ${#ipas[@]} -eq 0 ]; then
            echo "::notice::No IPA was produced (expected with --survey-only)"
            exit 0
          fi
          for ipa in "${ipas[@]}"; do
            NAME=$(basename "$ipa")
            ENC=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$NAME")
            echo "Uploading $NAME to $GAME_ID/"
            curl -f -X PUT --upload-file "$ipa" "${UPLOAD_URL%/}/$GAME_ID/$ENC"
          done

      - name: Remove keys
        if: always()
        run: rm -rf ~/keys
