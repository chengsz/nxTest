name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      cache:
        description: 'Which saved build to start from'
        type: choice
        options:
          - latest          # newest save, even from a failed run (keeps partial shader progress)
          - last-success    # newest save from a run that produced an IPA
          - none            # start clean
        default: latest
      romfs:
        description: 'Game data: separate romfs.img (small IPA) or inside the IPA'
        type: choice
        options:
          - separate
          - inside
        default: separate
      extra_args:
        description: 'Extra build_ipa_from_nsp.py options (optional, e.g. --no-heap-check, --survey-only)'
        required: false
        default: ''

# Only one run at a time: NSP_ARCHIVE_URL points at one game
concurrency:
  group: nxnative-build
  cancel-in-progress: false

jobs:
  build-ipa:
    runs-on: xcode-27          # nxnative pins its Metal compiler to Xcode 27.1 (dmsh_chain.lock)
    timeout-minutes: 360       # GitHub-hosted maximum

    steps:
      - name: Select Xcode 27.1
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_27.1*.app' | sort -V | tail -n 1)
          [ -n "$XCODE" ] || XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -n 1)
          XCODE=$(cd "$XCODE" && pwd -P)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "KEEP_XCODE=$XCODE" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Free disk space
        run: |
          df -h /
          for x in /Applications/Xcode*.app; do
            [ -L "$x" ] && continue
            [ "$x" = "$KEEP_XCODE" ] && continue
            echo "Removing $x"
            sudo rm -rf "$x"
          done
          # Keep simulator runtimes: Xcode needs the iOS platform even for a device build
          sudo rm -rf /Library/Developer/CommandLineTools
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf /Users/runner/hostedtoolcache
          df -h /

      - name: Make sure the iOS platform is installed
        run: |
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK_VER"
          if xcrun simctl list runtimes | grep -q "iOS $SDK_VER"; then
            echo "iOS $SDK_VER platform is installed"
          else
            echo "iOS $SDK_VER platform missing - downloading it (this can take a while)"
            xcodebuild -downloadPlatform iOS
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Checkout nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          path: nxnative
          submodules: recursive
          lfs: true

      - name: Record nxnative commit
        run: echo "NX_SHA=$(git -C nxnative rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          brew install xcodegen zstd aria2 sevenzip glslang
          brew cleanup --prune=all || true
          python3 -m pip install lz4 "capstone>=5,<6" fonttools backports.zstd
          python3 --version
          dotnet --list-runtimes

      - name: Download and extract game
        env:
          NSP_URL: ${{ secrets.NSP_ARCHIVE_URL }}
        run: |
          set -euo pipefail
          GAME_DIR=~/Games/TargetGame
          mkdir -p "$GAME_DIR" ~/dl

          aria2c -x 16 -s 16 --console-log-level=warn --summary-interval=0 \
            "$NSP_URL" -d ~/dl -o download.bin
          FILE=~/dl/download.bin

          # Identify the download by its contents, not its name
          MAGIC=$(head -c 4 "$FILE" | xxd -p)
          XCI_MAGIC=$(dd if="$FILE" bs=1 skip=256 count=4 2>/dev/null | xxd -p)
          case "$MAGIC" in
            50465330) NAME=game.nsp ;;   # "PFS0": NSP (or NSZ)
            504b0304) NAME=game.zip ;;
            377abcaf) NAME=game.7z  ;;
            52617221) NAME=game.rar ;;
            *) if [ "$XCI_MAGIC" = "48454144" ]; then NAME=game.xci   # "HEAD" at 0x100
               else echo "::error::Unrecognized download (first bytes: $MAGIC). Check NSP_ARCHIVE_URL."; exit 1; fi ;;
          esac
          echo "Downloaded: $NAME"
          case "$NAME" in
            game.nsp|game.xci) mv "$FILE" "$GAME_DIR/$NAME" ;;
            *) 7zz e "$FILE" -o"$GAME_DIR" -y > /dev/null; rm -f "$FILE" ;;
          esac
          ls -lh "$GAME_DIR"

          # Pin timestamps so nxnative's reuse checks see the same files every run
          find "$GAME_DIR" -maxdepth 1 -type f -exec touch -h -t 202001010000 {} +

          # A fingerprint of the game files (their sizes) names the cache, so no Title ID is needed
          FP=$(find "$GAME_DIR" -maxdepth 1 -type f \( -iname '*.nsp' -o -iname '*.nsz' -o -iname '*.xci' -o -iname '*.xcz' \) \
                 -exec stat -f '%z' {} + | sort -n | shasum -a 256 | cut -c1-12)
          if [ -z "$FP" ] || [ "$FP" = "$(printf '' | shasum -a 256 | cut -c1-12)" ]; then
            echo "::error::No NSP, NSZ, XCI or XCZ found in the download"
            exit 1
          fi
          echo "Game fingerprint: $FP"
          echo "GAME_FP=$FP" >> "$GITHUB_ENV"

      - name: Download keys
        env:
          KEYS_URL: ${{ secrets.KEYS_URL }}
        run: |
          mkdir -p ~/keys
          curl -fsSL "$KEYS_URL" -o ~/keys/prod.keys

      - name: Restore build cache (latest)
        if: inputs.cache == 'latest'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Games/TargetGame/*_build
            !~/Games/TargetGame/*_build/extract
          key: nxnative-v4-${{ env.GAME_FP }}-${{ env.NX_SHA }}-${{ github.run_id }}
          restore-keys: |
            nxnative-v4-${{ env.GAME_FP }}-${{ env.NX_SHA }}-
            nxnative-v4-${{ env.GAME_FP }}-

      - name: Restore build cache (last success)
        if: inputs.cache == 'last-success'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Games/TargetGame/*_build
            !~/Games/TargetGame/*_build/extract
          key: nxnative-good-v4-${{ env.GAME_FP }}-${{ github.run_id }}
          restore-keys: |
            nxnative-good-v4-${{ env.GAME_FP }}-

      - name: Build IPA
        working-directory: ./nxnative
        timeout-minutes: 300   # stop before the job limit so the cache still gets saved
        env:
          EXTRA_ARGS: ${{ inputs.extra_args }}
          ROMFS_MODE: ${{ inputs.romfs }}
        run: |
          set -euo pipefail
          df -h /
          ROMFS_ARGS=""
          [ "$ROMFS_MODE" = "separate" ] && ROMFS_ARGS="--romfs separate"
          # nxnative finds the Title ID itself (ticket, file name or metadata).
          # It uses the repo's prebuilt shader translator as-is.
          # shellcheck disable=SC2086
          python3 scripts/build_ipa_from_nsp.py ~/Games/TargetGame -k ~/keys/prod.keys $ROMFS_ARGS $EXTRA_ARGS

      - name: Detected Title ID and survey
        if: always()
        run: |
          shopt -s nullglob
          dirs=(~/Games/TargetGame/*_build)
          if [ ${#dirs[@]} -gt 0 ]; then
            ID=$(basename "${dirs[0]}" _build)
            echo "Title ID detected by nxnative: $ID"
            echo "GAME_ID=$ID" >> "$GITHUB_ENV"
            if ls -d nxnative/dm/games/"$ID"* > /dev/null 2>&1; then
              echo "::notice::$ID has an nxnative profile"
            else
              echo "::warning::$ID has no nxnative profile: best-effort build that may not boot"
            fi
          fi
          for f in ~/Games/TargetGame/*_survey/survey.md; do
            echo "===== $f ====="
            cat "$f"
          done

      - name: Save build cache (latest, every run)
        if: always() && env.GAME_FP != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Games/TargetGame/*_build
            !~/Games/TargetGame/*_build/extract
          key: nxnative-v4-${{ env.GAME_FP }}-${{ env.NX_SHA }}-${{ github.run_id }}

      - name: Save build cache (known good)
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Games/TargetGame/*_build
            !~/Games/TargetGame/*_build/extract
          key: nxnative-good-v4-${{ env.GAME_FP }}-${{ github.run_id }}

      - name: Upload IPA to Oracle Cloud
        if: success()
        env:
          UPLOAD_URL: ${{ secrets.OCI_UPLOAD_URL }}
          ROMFS_MODE: ${{ inputs.romfs }}
        run: |
          shopt -s nullglob
          ipas=(~/Games/TargetGame/*.ipa)
          if [ ${#ipas[@]} -eq 0 ]; then
            echo "::notice::No IPA was produced (expected with --survey-only)"
            exit 0
          fi
          FOLDER="${GAME_ID:-unknown}"
          for ipa in "${ipas[@]}"; do
            NAME=$(basename "$ipa")
            ENC=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$NAME")
            ls -lh "$ipa"
            echo "Uploading $NAME to $FOLDER/"
            curl -f -X PUT --upload-file "$ipa" "${UPLOAD_URL%/}/$FOLDER/$ENC"
          done

          # With --romfs separate the game data is a separate image: upload it as romfs.img
          if [ "$ROMFS_MODE" = "separate" ]; then
            IMG=$(find ~/Games/TargetGame -type f -iname 'romfs.img' -exec ls -s {} + 2>/dev/null | sort -n | tail -n 1 | awk '{print $2}')
            if [ -n "$IMG" ]; then
              ls -lh "$IMG"
              echo "Uploading $IMG as $FOLDER/romfs.img"
              curl -f -X PUT --upload-file "$IMG" "${UPLOAD_URL%/}/$FOLDER/romfs.img"
            else
              echo "::warning::Built with --romfs separate but no romfs.img was found to upload"
            fi
          fi

      - name: Remove keys
        if: always()
        run: rm -rf ~/keys
